<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VideoHub — Modern Web Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  
  <style>
    :root {
      --bg: #09090b;
      --card-bg: #121215;
      --card-hover: #1c1c21;
      --border: #27272a;
      --border-focus: #3f3f46;
      --text: #fafafa;
      --text-muted: #a1a1aa;
      --accent: #ef4444;
      --accent-glow: rgba(239, 68, 68, 0.2);
      --radius: 14px;
      --header-h: 68px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* ---------------------------------------------
       NAVBAR
    --------------------------------------------- */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      height: var(--header-h);
      background: rgba(9, 9, 11, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      gap: 24px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 36px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text);
      cursor: pointer;
      text-decoration: none;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px var(--accent-glow);
    }
    .logo-icon svg { width: 16px; height: 16px; fill: #fff; }

    .nav-tabs {
      display: flex;
      background: #18181b;
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .nav-tab {
      display: flex;
      align-items: center;
      gap: 8px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 13.5px;
      font-weight: 600;
      padding: 6px 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .nav-tab svg { width: 16px; height: 16px; stroke-width: 2.2; }
    .nav-tab:hover { color: var(--text); }
    .nav-tab.active {
      background: #27272a;
      color: var(--text);
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .search-bar {
      flex: 0 1 500px;
      position: relative;
    }

    .search-bar input {
      width: 100%;
      height: 40px;
      background: #18181b;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0 42px 0 16px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    .search-bar input:focus {
      border-color: var(--border-focus);
      background: #1c1c21;
    }

    .search-btn {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .search-btn:hover { color: var(--text); }
    .search-btn svg { width: 17px; height: 17px; }

    /* ---------------------------------------------
       LAYOUT CONTAINERS
    --------------------------------------------- */
    main {
      flex: 1;
      width: 100%;
      max-width: 1440px;
      margin: 0 auto;
      padding: 32px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #18181b;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 13.5px;
      font-weight: 600;
      padding: 8px 18px;
      border-radius: 9999px;
      cursor: pointer;
      margin-bottom: 24px;
      transition: all 0.2s;
    }
    .back-btn svg { width: 15px; height: 15px; }
    .back-btn:hover {
      background: #27272a;
      color: var(--text);
      transform: translateX(-2px);
    }

    /* ---------------------------------------------
       CREATOR SPOTLIGHT CARD (SEARCH)
    --------------------------------------------- */
    .creator-spotlight {
      background: linear-gradient(180deg, #18181c 0%, #121215 100%);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .spotlight-left {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .spotlight-avatar {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--border);
      background: #27272a;
    }

    .spotlight-meta h2 {
      font-size: 19px;
      font-weight: 700;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .spotlight-meta p {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.4;
      max-width: 580px;
    }

    .spotlight-btn {
      background: #fafafa;
      color: #09090b;
      border: none;
      padding: 10px 22px;
      border-radius: 20px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.15s;
    }
    .spotlight-btn:hover { opacity: 0.9; }

    /* ---------------------------------------------
       GRID CARDS
    --------------------------------------------- */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 24px;
    }

    .video-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s ease, border-color 0.2s;
    }
    .video-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45);
      border-color: var(--border-focus);
    }

    .thumb-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #1c1c21;
      overflow: hidden;
    }

    .thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }
    .video-card:hover .thumb-wrap img {
      transform: scale(1.03);
    }

    .card-meta {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .card-title {
      font-size: 14.5px;
      font-weight: 600;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      color: var(--text);
    }

    .card-channel {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
      width: fit-content;
    }
    .card-channel:hover {
      color: #fff;
      text-decoration: underline;
    }

    /* ---------------------------------------------
       THEATER PLAYER & ORGANIZED COMMENTS
    --------------------------------------------- */
    .player-layout {
      display: none;
      grid-template-columns: 1fr 400px;
      gap: 32px;
      align-items: start;
    }

    @media (max-width: 1080px) {
      .player-layout { grid-template-columns: 1fr; }
    }

    .theater-frame {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      border-radius: var(--radius);
      overflow: hidden;
      background: #000;
      border: 1px solid var(--border);
    }

    .theater-frame iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .theater-details {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .theater-title {
      font-size: 21px;
      font-weight: 700;
      line-height: 1.35;
    }

    .channel-badge {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: fit-content;
      cursor: pointer;
    }
    .channel-badge:hover { background: var(--card-hover); }

    .channel-badge img {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      background: #27272a;
    }

    .channel-badge-info h4 { font-size: 14.5px; font-weight: 600; }
    .channel-badge-info p { font-size: 12px; color: var(--text-muted); }

    /* Polished Comment Section Box */
    .comments-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      height: 720px;
      overflow: hidden;
    }

    .comments-card-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .comments-card-header h3 {
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .live-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      color: #22c55e;
      background: rgba(34, 197, 94, 0.1);
      padding: 4px 8px;
      border-radius: 9999px;
    }

    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #22c55e;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    /* Comment Form */
    .comment-input-area {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 12px;
      align-items: flex-start;
      background: rgba(255,255,255,0.01);
    }

    .user-avatar-mini {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #3f3f46;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .comment-form {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .comment-form input {
      width: 100%;
      background: none;
      border: none;
      border-bottom: 1px solid var(--border);
      padding: 6px 0;
      color: #fff;
      font-size: 13.5px;
      outline: none;
      transition: border-color 0.2s;
    }
    .comment-form input:focus { border-bottom-color: var(--text); }

    .comment-form-actions {
      display: flex;
      justify-content: flex-end;
    }

    .comment-submit-btn {
      background: #27272a;
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .comment-submit-btn:hover { background: #3f3f46; }

    /* Comment Item List */
    .comments-scroll-list {
      flex: 1;
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .comment-row {
      display: flex;
      gap: 12px;
      font-size: 13px;
    }

    .comment-row img {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      background: #27272a;
    }

    .comment-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .comment-user-line {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .comment-author {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text);
    }

    .comment-time {
      font-size: 11.5px;
      color: var(--text-muted);
    }

    .comment-text {
      color: #e4e4e7;
      line-height: 1.45;
      font-size: 13px;
      word-break: break-word;
    }

    .comment-actions-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 4px;
      color: var(--text-muted);
      font-size: 11.5px;
    }
    .comment-actions-bar span { cursor: pointer; display: flex; align-items: center; gap: 4px; }
    .comment-actions-bar span:hover { color: #fff; }

    /* ---------------------------------------------
       SHORTS VIEWPORT & DRAWER
    --------------------------------------------- */
    .shorts-viewport {
      display: none;
      height: calc(100vh - var(--header-h) - 48px);
      max-width: 440px;
      margin: 0 auto;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: #000;
    }
    .shorts-viewport::-webkit-scrollbar { display: none; }

    .short-slot {
      height: 100%;
      width: 100%;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      position: relative;
      overflow: hidden;
      background: #000;
    }

    .short-iframe-wrap { width: 100%; height: 100%; }
    .short-iframe-wrap iframe { width: 100% !important; height: 100% !important; border: none; }

    .short-glass-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 24px 18px;
      background: linear-gradient(0deg, rgba(9,9,11,0.95) 0%, rgba(9,9,11,0.4) 30%, transparent 60%);
    }

    .short-info { max-width: 76%; pointer-events: auto; }
    .short-info .author-tag {
      display: inline-block;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 6px;
      cursor: pointer;
      color: #fff;
    }
    .short-info .author-tag:hover { text-decoration: underline; }

    .short-info .caption {
      font-size: 13px;
      color: #d4d4d8;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .short-rail {
      display: flex;
      flex-direction: column;
      gap: 16px;
      pointer-events: auto;
      align-items: center;
    }

    .rail-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(39, 39, 42, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      gap: 2px;
      transition: all 0.2s ease;
    }
    .rail-btn:hover {
      background: rgba(63, 63, 70, 0.9);
      transform: scale(1.05);
    }
    .rail-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; }
    .rail-btn span { font-size: 10px; font-weight: 600; color: #d4d4d8; }

    /* Shorts Drawer */
    .drawer {
      position: fixed;
      bottom: -100%;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 440px;
      height: 64%;
      background: #121215;
      border: 1px solid var(--border);
      border-bottom: none;
      border-radius: 20px 20px 0 0;
      transition: bottom 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 200;
      display: flex;
      flex-direction: column;
      box-shadow: 0 -12px 40px rgba(0, 0, 0, 0.8);
    }
    .drawer.open { bottom: 0; }

    .drawer-top {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }
    .drawer-top h4 { font-size: 15px; font-weight: 700; }
    .close-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; }
    .close-btn svg { width: 20px; height: 20px; }

    /* ---------------------------------------------
       CHANNEL PROFILE VIEW
    --------------------------------------------- */
    .channel-layout {
      display: none;
      flex-direction: column;
      gap: 28px;
    }

    .channel-hero {
      position: relative;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .hero-banner {
      width: 100%;
      height: 200px;
      object-fit: cover;
      background: #18181b;
      display: none;
    }

    .hero-bar {
      padding: 24px;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .hero-bar img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 3px solid #18181b;
      object-fit: cover;
      background: #27272a;
    }

    .hero-meta h2 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }

    .hero-meta p {
      font-size: 13.5px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .feedback-state {
      text-align: center;
      padding: 60px 0;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="brand-group">
      <div class="logo" onclick="app.showFeed()">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20 6 4"></polygon></svg>
        </div>
        VideoHub
      </div>

      <nav class="nav-tabs">
        <button id="tabVideos" class="nav-tab active" onclick="app.showFeed()">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><rect width="20" height="15" x="2" y="4.5" rx="2"></rect><polygon points="10 9 15 12 10 15 10 9"></polygon></svg>
          Videos
        </button>
        <button id="tabShorts" class="nav-tab" onclick="app.showShorts()">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
          Shorts
        </button>
      </nav>
    </div>

    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search creators, topics, or videos..." onkeydown="if(event.key==='Enter') app.search()" />
      <button class="search-btn" onclick="app.search()" aria-label="Search">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      </button>
    </div>
  </header>

  <main>
    <!-- Back Button -->
    <button id="backNav" class="back-btn" style="display: none;" onclick="app.goBack()">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
      Back
    </button>

    <!-- Main Feed / Search Section -->
    <section id="feedSection">
      <!-- Injected Creator Spotlight -->
      <div id="creatorSpotlightContainer"></div>
      <div id="feedGrid" class="video-grid"></div>
    </section>

    <!-- Theater Video Player Layout -->
    <section id="theaterSection" class="player-layout">
      <div class="theater-main">
        <div class="theater-frame">
          <iframe id="videoIframe" allowfullscreen allow="autoplay; encrypted-media"></iframe>
        </div>
        <div class="theater-details">
          <h1 id="playerTitle" class="theater-title">Loading...</h1>
          <div id="playerChannelRow" class="channel-badge">
            <img id="playerChannelAvatar" src="" alt="Creator" />
            <div class="channel-badge-info">
              <h4 id="playerChannelName">...</h4>
              <p id="playerSubscriberCount">...</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Live Comment Section -->
      <aside class="comments-card">
        <div class="comments-card-header">
          <h3>
            Comments
            <span id="commentCountBadge" style="font-size:12px;color:var(--text-muted);font-weight:500;"></span>
          </h3>
          <div class="live-indicator">
            <span class="live-dot"></span> Live
          </div>
        </div>

        <!-- Add Comment Form -->
        <div class="comment-input-area">
          <div class="user-avatar-mini">Y</div>
          <form class="comment-form" onsubmit="event.preventDefault(); app.submitLocalComment();">
            <input type="text" id="commentInputField" placeholder="Add a comment..." />
            <div class="comment-form-actions">
              <button type="submit" class="comment-submit-btn">Comment</button>
            </div>
          </form>
        </div>

        <div id="commentsList" class="comments-scroll-list"></div>
      </aside>
    </section>

    <!-- Shorts Viewport -->
    <section id="shortsSection" class="shorts-viewport"></section>

    <!-- Channel Profile View -->
    <section id="channelSection" class="channel-layout">
      <div class="channel-hero">
        <img id="channelBanner" class="hero-banner" alt="Banner" />
        <div class="hero-bar">
          <img id="channelAvatar" alt="Avatar" />
          <div class="hero-meta">
            <h2 id="channelTitle">...</h2>
            <p id="channelStats">...</p>
          </div>
        </div>
      </div>
      <h3 style="font-size: 18px; font-weight: 700;">Uploads</h3>
      <div id="channelVideosGrid" class="video-grid"></div>
    </section>

    <!-- Status Feedback -->
    <div id="statusMsg" class="feedback-state">Loading...</div>
  </main>

  <!-- Shorts Drawer Sheet -->
  <div class="drawer" id="shortsDrawer">
    <div class="drawer-top">
      <h4>Comments</h4>
      <button class="close-btn" onclick="app.closeShortsDrawer()">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
    
    <div class="comment-input-area">
      <div class="user-avatar-mini">Y</div>
      <form class="comment-form" onsubmit="event.preventDefault(); app.submitShortsComment();">
        <input type="text" id="shortsCommentInput" placeholder="Add a comment..." />
        <div class="comment-form-actions">
          <button type="submit" class="comment-submit-btn">Comment</button>
        </div>
      </form>
    </div>

    <div class="comments-scroll-list" id="shortsDrawerComments"></div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    const CONFIG = {
      API_KEY: 'AIzaSyDCZpIEH3_aWEjVTR0tv7ZHtgGDhZssjyI',
      BASE_URL: 'https://www.googleapis.com/youtube/v3',
      COMMENT_POLL_INTERVAL: 25000 // 25 seconds
    };

    const utils = {
      formatCount(num) {
        if (!num) return '0';
        const n = parseInt(num, 10);
        if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
        if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
        return n.toLocaleString();
      },
      timeAgo(dateString) {
        const date = new Date(dateString);
        const seconds = Math.floor((new Date() - date) / 1000);
        if (seconds < 60) return 'just now';
        const minutes = Math.floor(seconds / 60);
        if (minutes < 60) return `${minutes}m ago`;
        const hours = Math.floor(minutes / 60);
        if (hours < 24) return `${hours}h ago`;
        const days = Math.floor(hours / 24);
        if (days < 30) return `${days}d ago`;
        const months = Math.floor(days / 30);
        if (months < 12) return `${months}mo ago`;
        return `${Math.floor(months / 12)}y ago`;
      }
    };

    class VideoHubApp {
      constructor() {
        this.currentView = 'feed';
        this.prevView = 'feed';
        this.activeVideoId = null;
        this.activeShortsVideoId = null;
        this.commentPollTimer = null;
        this.localComments = new Map(); // stores local user comments by videoId
        this.shortsPlayers = new Map();
        this.shortsObserver = null;
        this.init();
      }

      init() {
        this.loadPopularFeed();
      }

      setStatus(msg) {
        const el = document.getElementById('statusMsg');
        if (msg) {
          el.textContent = msg;
          el.style.display = 'block';
        } else {
          el.style.display = 'none';
        }
      }

      setView(view) {
        this.prevView = this.currentView;
        this.currentView = view;

        // Clear comment live-poller if leaving player views
        if (view !== 'theater' && !document.getElementById('shortsDrawer').classList.contains('open')) {
          this.stopCommentPolling();
        }

        document.getElementById('feedSection').style.display = view === 'feed' ? 'block' : 'none';
        document.getElementById('theaterSection').style.display = view === 'theater' ? 'grid' : 'none';
        document.getElementById('shortsSection').style.display = view === 'shorts' ? 'block' : 'none';
        document.getElementById('channelSection').style.display = view === 'channel' ? 'flex' : 'none';
        document.getElementById('backNav').style.display = (view === 'theater' || view === 'channel') ? 'inline-flex' : 'none';

        document.getElementById('tabVideos').classList.toggle('active', view === 'feed');
        document.getElementById('tabShorts').classList.toggle('active', view === 'shorts');

        if (view !== 'theater') {
          document.getElementById('videoIframe').src = '';
        }

        if (view !== 'shorts') {
          this.shortsPlayers.forEach(p => {
            if (p && typeof p.pauseVideo === 'function') p.pauseVideo();
          });
        }

        this.setStatus(null);
        window.scrollTo(0, 0);
      }

      goBack() {
        if (this.prevView === 'shorts') {
          this.showShorts();
        } else {
          this.showFeed();
        }
      }

      showFeed() {
        this.setView('feed');
        if (!document.getElementById('feedGrid').children.length) {
          this.loadPopularFeed();
        }
      }

      // --- FEED & CREATOR SEARCH ---
      async loadPopularFeed() {
        this.setStatus('Discovering trending videos...');
        document.getElementById('creatorSpotlightContainer').innerHTML = '';
        this.setView('feed');

        try {
          const res = await fetch(`${CONFIG.BASE_URL}/videos?part=snippet,statistics&chart=mostPopular&regionCode=US&maxResults=24&key=${CONFIG.API_KEY}`);
          const data = await res.json();
          if (!data.items) throw new Error(data.error?.message || 'Failed to fetch items');
          this.renderCards(data.items.map(item => ({
            id: item.id,
            channelId: item.snippet.channelId,
            title: item.snippet.title,
            thumbnail: item.snippet.thumbnails.high?.url || item.snippet.thumbnails.default?.url,
            uploader: item.snippet.channelTitle
          })), 'feedGrid');
        } catch (err) {
          this.setStatus(`Error loading feed: ${err.message}`);
        }
      }

      async search() {
        const query = document.getElementById('searchInput').value.trim();
        if (!query) return;

        this.setStatus(`Searching for "${query}"...`);
        this.setView('feed');
        document.getElementById('creatorSpotlightContainer').innerHTML = '';

        try {
          // Query both channels and videos
          const res = await fetch(`${CONFIG.BASE_URL}/search?part=snippet&type=video,channel&maxResults=24&q=${encodeURIComponent(query)}&key=${CONFIG.API_KEY}`);
          const data = await res.json();
          if (!data.items) throw new Error('Search request failed');

          // Check if top result or any item is a creator channel
          const matchedChannel = data.items.find(i => i.id.kind === 'youtube#channel');
          if (matchedChannel) {
            this.fetchAndRenderCreatorSpotlight(matchedChannel.id.channelId);
          }

          // Filter standard video results
          const videoItems = data.items.filter(i => i.id.kind === 'youtube#video');
          this.renderCards(videoItems.map(item => ({
            id: item.id.videoId,
            channelId: item.snippet.channelId,
            title: item.snippet.title,
            thumbnail: item.snippet.thumbnails.high?.url || item.snippet.thumbnails.default?.url,
            uploader: item.snippet.channelTitle
          })), 'feedGrid');
        } catch (err) {
          this.setStatus(`Search failed: ${err.message}`);
        }
      }

      async fetchAndRenderCreatorSpotlight(channelId) {
        try {
          const res = await fetch(`${CONFIG.BASE_URL}/channels?part=snippet,statistics&id=${channelId}&key=${CONFIG.API_KEY}`);
          const data = await res.json();
          if (!data.items?.[0]) return;

          const ch = data.items[0];
          const container = document.getElementById('creatorSpotlightContainer');
          container.innerHTML = `
            <div class="creator-spotlight">
              <div class="spotlight-left">
                <img class="spotlight-avatar" src="${ch.snippet.thumbnails.medium?.url || ch.snippet.thumbnails.default?.url}" alt="${ch.snippet.title}" />
                <div class="spotlight-meta">
                  <h2>${ch.snippet.title}</h2>
                  <p>${utils.formatCount(ch.statistics.subscriberCount)} subscribers • ${utils.formatCount(ch.statistics.videoCount)} videos</p>
                  <p style="margin-top:4px;color:#d4d4d8;">${ch.snippet.description || 'Visit channel profile to view full video catalog.'}</p>
                </div>
              </div>
              <button class="spotlight-btn" onclick="app.loadChannel('${ch.id}')">View Channel</button>
            </div>
          `;
        } catch (e) {
          console.warn('Could not load channel spotlight', e);
        }
      }

      renderCards(items, targetId) {
        const container = document.getElementById(targetId);
        container.innerHTML = '';
        this.setStatus(null);

        if (!items.length) {
          this.setStatus('No videos found.');
          return;
        }

        items.forEach(item => {
          if (!item.id) return;
          const card = document.createElement('article');
          card.className = 'video-card';
          card.innerHTML = `
            <div class="thumb-wrap">
              <img src="${item.thumbnail}" alt="${item.title}" loading="lazy" />
            </div>
            <div class="card-meta">
              <h3 class="card-title">${item.title}</h3>
              <span class="card-channel">${item.uploader}</span>
            </div>
          `;

          card.onclick = (e) => {
            if (e.target.classList.contains('card-channel')) {
              this.loadChannel(item.channelId);
            } else {
              this.playVideo(item.id, item.title, item.channelId, item.uploader);
            }
          };
          container.appendChild(card);
        });
      }

      // --- THEATER PLAYER ---
      async playVideo(id, title, channelId, channelTitle) {
        this.activeVideoId = id;
        this.setView('theater');

        document.getElementById('videoIframe').src = `https://www.youtube-nocookie.com/embed/${id}?autoplay=1`;
        document.getElementById('playerTitle').textContent = title;
        document.getElementById('playerChannelName').textContent = channelTitle;
        document.getElementById('playerSubscriberCount').textContent = 'Loading subscriber count...';
        document.getElementById('playerChannelAvatar').src = '';
        document.getElementById('commentInputField').value = '';

        document.getElementById('playerChannelRow').onclick = () => this.loadChannel(channelId);

        try {
          const res = await fetch(`${CONFIG.BASE_URL}/channels?part=snippet,statistics&id=${channelId}&key=${CONFIG.API_KEY}`);
          const data = await res.json();
          if (data.items?.[0]) {
            const ch = data.items[0];
            document.getElementById('playerChannelAvatar').src = ch.snippet.thumbnails.default.url;
            document.getElementById('playerSubscriberCount').textContent = `${utils.formatCount(ch.statistics.subscriberCount)} subscribers`;
          }
        } catch (err) {
          console.warn('Channel stats unavailable');
        }

        this.refreshComments(id, 'commentsList');
        this.startCommentPolling(id, 'commentsList');
      }

      // --- LIVE COMMENTS SYSTEM ---
      startCommentPolling(videoId, containerId) {
        this.stopCommentPolling();
        this.commentPollTimer = setInterval(() => {
          this.refreshComments(videoId, containerId, true);
        }, CONFIG.COMMENT_POLL_INTERVAL);
      }

      stopCommentPolling() {
        if (this.commentPollTimer) {
          clearInterval(this.commentPollTimer);
          this.commentPollTimer = null;
        }
      }

      async refreshComments(videoId, targetId, isPolling = false) {
        const target = document.getElementById(targetId);
        if (!isPolling) {
          target.innerHTML = '<p class="feedback-state">Loading conversation...</p>';
        }

        try {
          const res = await fetch(`${CONFIG.BASE_URL}/commentThreads?part=snippet&videoId=${videoId}&maxResults=25&key=${CONFIG.API_KEY}`);
          const data = await res.json();

          if (!data.items?.length && (!this.localComments.has(videoId) || this.localComments.get(videoId).length === 0)) {
            target.innerHTML = '<p style="color:var(--text-muted);font-size:13px;padding:24px 0;text-align:center;">Comments are turned off or none exist.</p>';
            return;
          }

          // Fetch local mock comments saved for this video
          const userComments = this.localComments.get(videoId) || [];

          // Merge local posts at top + API comments
          const apiComments = (data.items || []).map(item => {
            const c = item.snippet.topLevelComment.snippet;
            return {
              author: c.authorDisplayName,
              avatar: c.authorProfileImageUrl,
              text: c.textDisplay,
              publishedAt: c.publishedAt,
              likeCount: c.likeCount || 0
            };
          });

          const merged = [...userComments, ...apiComments];

          target.innerHTML = merged.map(c => `
            <div class="comment-row">
              <img src="${c.avatar}" alt="${c.author}" />
              <div class="comment-content">
                <div class="comment-user-line">
                  <span class="comment-author">${c.author}</span>
                  <span class="comment-time">${utils.timeAgo(c.publishedAt)}</span>
                </div>
                <div class="comment-text">${c.text}</div>
                <div class="comment-actions-bar">
                  <span>👍 ${c.likeCount > 0 ? utils.formatCount(c.likeCount) : ''}</span>
                  <span>Reply</span>
                </div>
              </div>
            </div>
          `).join('');

          const countBadge = document.getElementById('commentCountBadge');
          if (countBadge && targetId === 'commentsList') {
            countBadge.textContent = `(${merged.length})`;
          }

        } catch (err) {
          if (!isPolling) {
            target.innerHTML = '<p style="color:var(--text-muted);font-size:13px;text-align:center;">Comments could not be retrieved.</p>';
          }
        }
      }

      submitLocalComment() {
        const input = document.getElementById('commentInputField');
        const text = input.value.trim();
        if (!text || !this.activeVideoId) return;

        const newComment = {
          author: 'You',
          avatar: 'https://www.gstatic.com/images/branding/product/2x/avatar_square_grey_512dp.png',
          text: text,
          publishedAt: new Date().toISOString(),
          likeCount: 0
        };

        if (!this.localComments.has(this.activeVideoId)) {
          this.localComments.set(this.activeVideoId, []);
        }
        this.localComments.get(this.activeVideoId).unshift(newComment);

        input.value = '';
        this.refreshComments(this.activeVideoId, 'commentsList', true);
      }

      submitShortsComment() {
        const input = document.getElementById('shortsCommentInput');
        const text = input.value.trim();
        if (!text || !this.activeShortsVideoId) return;

        const newComment = {
          author: 'You',
          avatar: 'https://www.gstatic.com/images/branding/product/2x/avatar_square_grey_512dp.png',
          text: text,
          publishedAt: new Date().toISOString(),
          likeCount: 0
        };

        if (!this.localComments.has(this.activeShortsVideoId)) {
          this.localComments.set(this.activeShortsVideoId, []);
        }
        this.localComments.get(this.activeShortsVideoId).unshift(newComment);

        input.value = '';
        this.refreshComments(this.activeShortsVideoId, 'shortsDrawerComments', true);
      }

      // --- SHORTS VERTICAL FEED ---
      async showShorts() {
        this.setView('shorts');
        const container = document.getElementById('shortsSection');
        if (container.children.length > 0) return;

        this.setStatus('Fetching Shorts...');

        try {
          const searchRes = await fetch(`${CONFIG.BASE_URL}/search?part=snippet&type=video&videoDuration=short&q=${encodeURIComponent('#shorts')}&maxResults=10&key=${CONFIG.API_KEY}`);
          const searchData = await searchRes.json();
          if (!searchData.items?.length) throw new Error('Shorts not found');

          const ids = searchData.items.map(i => i.id.videoId).join(',');
          const statsRes = await fetch(`${CONFIG.BASE_URL}/videos?part=snippet,statistics&id=${ids}&key=${CONFIG.API_KEY}`);
          const statsData = await statsRes.json();

          container.innerHTML = '';
          this.setStatus(null);

          statsData.items.forEach((video, idx) => {
            const slot = document.createElement('div');
            slot.className = 'short-slot';
            slot.dataset.index = idx;

            slot.innerHTML = `
              <div class="short-iframe-wrap">
                <div id="short-player-${idx}"></div>
              </div>
              <div class="short-glass-overlay">
                <div class="short-info">
                  <span class="author-tag" onclick="app.loadChannel('${video.snippet.channelId}')">@${video.snippet.channelTitle}</span>
                  <p class="caption">${video.snippet.title}</p>
                </div>
                <div class="short-rail">
                  <button class="rail-btn" type="button">
                    <svg viewBox="0 0 24 24" stroke-width="2.2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                    <span>${utils.formatCount(video.statistics.likeCount)}</span>
                  </button>
                  <button class="rail-btn" type="button" onclick="app.openShortsDrawer('${video.id}')">
                    <svg viewBox="0 0 24 24" stroke-width="2.2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                    <span>${utils.formatCount(video.statistics.commentCount)}</span>
                  </button>
                  <button class="rail-btn" type="button" onclick="navigator.clipboard.writeText('https://youtube.com/shorts/${video.id}')">
                    <svg viewBox="0 0 24 24" stroke-width="2.2"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
                    <span>Share</span>
                  </button>
                </div>
              </div>
            `;

            container.appendChild(slot);

            if (window.YT && YT.Player) {
              const p = new YT.Player(`short-player-${idx}`, {
                videoId: video.id,
                playerVars: {
                  autoplay: 0,
                  controls: 1,
                  rel: 0,
                  playsinline: 1,
                  loop: 1,
                  playlist: video.id
                }
              });
              this.shortsPlayers.set(idx, p);
            }
          });

          this.initShortsObserver();
        } catch (err) {
          this.setStatus(`Error loading Shorts: ${err.message}`);
        }
      }

      initShortsObserver() {
        if (this.shortsObserver) this.shortsObserver.disconnect();
        this.shortsObserver = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            const idx = parseInt(entry.target.dataset.index, 10);
            const player = this.shortsPlayers.get(idx);
            if (!player || typeof player.playVideo !== 'function') return;

            if (entry.isIntersecting) {
              player.playVideo();
            } else {
              player.pauseVideo();
            }
          });
        }, { threshold: 0.7 });

        document.querySelectorAll('.short-slot').forEach(el => this.shortsObserver.observe(el));
      }

      openShortsDrawer(videoId) {
        this.activeShortsVideoId = videoId;
        document.getElementById('shortsDrawer').classList.add('open');
        document.getElementById('shortsCommentInput').value = '';
        this.refreshComments(videoId, 'shortsDrawerComments');
        this.startCommentPolling(videoId, 'shortsDrawerComments');
      }

      closeShortsDrawer() {
        document.getElementById('shortsDrawer').classList.remove('open');
        this.stopCommentPolling();
      }

      // --- CHANNEL PROFILE VIEW ---
      async loadChannel(channelId) {
        this.setView('channel');
        this.setStatus('Loading creator profile...');

        try {
          const res = await fetch(`${CONFIG.BASE_URL}/channels?part=snippet,contentDetails,statistics,brandingSettings&id=${channelId}&key=${CONFIG.API_KEY}`);
          const data = await res.json();
          if (!data.items?.length) throw new Error('Channel details missing');

          const ch = data.items[0];
          document.getElementById('channelTitle').textContent = ch.snippet.title;
          document.getElementById('channelAvatar').src = ch.snippet.thumbnails.medium?.url || ch.snippet.thumbnails.default?.url;
          document.getElementById('channelStats').textContent = `${utils.formatCount(ch.statistics.subscriberCount)} subscribers • ${utils.formatCount(ch.statistics.videoCount)} videos`;

          const banner = document.getElementById('channelBanner');
          const bannerUrl = ch.brandingSettings?.image?.bannerExternalUrl;
          if (bannerUrl) {
            banner.src = bannerUrl;
            banner.style.display = 'block';
          } else {
            banner.style.display = 'none';
          }

          const uploadsId = ch.contentDetails.relatedPlaylists.uploads;
          const plRes = await fetch(`${CONFIG.BASE_URL}/playlistItems?part=snippet&playlistId=${uploadsId}&maxResults=24&key=${CONFIG.API_KEY}`);
          const plData = await plRes.json();

          this.renderCards(plData.items.map(i => ({
            id: i.snippet.resourceId.videoId,
            channelId: channelId,
            title: i.snippet.title,
            thumbnail: i.snippet.thumbnails.high?.url || i.snippet.thumbnails.default?.url,
            uploader: ch.snippet.title
          })), 'channelVideosGrid');

        } catch (err) {
          this.setStatus(`Could not load channel: ${err.message}`);
        }
      }
    }

    const app = new VideoHubApp();
  </script>
</body>
</html>
