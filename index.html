<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YouTube Search</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    input, button { padding: 10px; font-size: 16px; }
    .video-item { margin-top: 15px; border-bottom: 1px solid #ccc; padding-bottom: 10px; }
  </style>
</head>
<body>

  <h2>YouTube Search</h2>
  <input type="text" id="query" placeholder="Enter search term...">
  <button onclick="runSearch()">Search</button>

  <div id="results"></div>

  <!-- Wrap your JavaScript inside <script> tags -->
  <script>
    const API_KEY = 'YOUR_YOUTUBE_API_KEY';

    async function runSearch() {
      const query = document.getElementById('query').value;
      const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=10&q=${encodeURIComponent(query)}&type=video&key=${API_KEY}`;

      try {
        const response = await fetch(url);
        const data = await response.json();
        
        const resultsDiv = document.getElementById('results');
        resultsDiv.innerHTML = '';

        data.items.forEach(item => {
          const title = item.snippet.title;
          const videoId = item.id.videoId;
          const videoUrl = `https://www.youtube.com/watch?v=${videoId}`;

          resultsDiv.innerHTML += `
            <div class="video-item">
              <h3><a href="${videoUrl}" target="_blank">${title}</a></h3>
            </div>
          `;
        });
      } catch (error) {
        console.error('Error fetching videos:', error);
      }
    }
  </script>

</body>
</html>
