<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Hub</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #1f1f1f;
      --surface-hover: #272727;
      --text: #ffffff;
      --text-secondary: #aaa;
      --accent: #ff0000;
      --border: #333;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: var(--bg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
      color: var(--accent);
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .search-container {
      display: flex;
      flex: 0 1 600px;
      gap: 8px;
    }

    .search-container input {
      width: 100%;
      padding: 10px 16px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 15px;
      outline: none;
    }

    .search-container input:focus {
      border-color: #555;
    }

    .search-container button {
      padding: 10px 20px;
      border-radius: 20px;
      border: none;
      background: var(--surface-hover);
      color: var(--text);
      cursor: pointer;
      font-weight: 500;
    }

    .search-container button:hover {
      background: #333;
    }

    main {
      padding: 24px;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    .player-view {
      display: none;
      flex-direction: column;
      gap: 16px;
    }

    .player-wrapper {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }

    .player-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .video-info {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .video-title {
      font-size: 20px;
      font-weight: 600;
    }

    .channel-title {
      color: var(--text-secondary);
      font-size: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--surface);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.15s ease;
      display: flex;
      flex-direction: column;
    }

    .card:hover {
      transform: translateY(-4px);
      background: var(--surface-hover);
    }

    .thumbnail-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #222;
    }

    .thumbnail-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .details {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .details .title {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .details .meta {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .status-msg {
      text-align: center;
      padding: 40px;
      color: var(--text-secondary);
      font-size: 16px;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo" onclick="loadMostPopular()">
      <span>▶</span> VideoHub
    </div>
    <div class="search-container">
      <input type="text" id="searchInput" placeholder="Search videos..." onkeydown="if(event.key==='Enter') searchVideos()" />
      <button onclick="searchVideos()">Search</button>
    </div>
  </header>

  <main>
    <div id="playerView" class="player-view">
      <div class="player-wrapper">
        <iframe id="videoIframe" allowfullscreen allow="autoplay; encrypted-media"></iframe>
      </div>
      <div class="video-info">
        <h1 id="playerTitle" class="video-title">Loading...</h1>
        <div id="playerChannel" class="channel-title">...</div>
      </div>
    </div>

    <div id="feedGrid" class="grid"></div>
    <div id="status" class="status-msg">Loading feed...</div>
  </main>

  <script>
    const API_KEY = 'AIzaSyDCZpIEH3_aWEjVTR0tv7ZHtgGDhZssjyI';
    const BASE_URL = 'https://www.googleapis.com/youtube/v3';

    // Load Popular Videos on Startup / Logo Click
    async function loadMostPopular() {
      showStatus("Loading popular videos...");
      document.getElementById('playerView').style.display = 'none';
      document.getElementById('feedGrid').style.display = 'grid';

      try {
        const url = `${BASE_URL}/videos?part=snippet,contentDetails,statistics&chart=mostPopular&regionCode=US&maxResults=24&key=${API_KEY}`;
        const res = await fetch(url);
        
        if (!res.ok) {
          const errData = await res.json();
          throw new Error(errData.error?.message || `HTTP error ${res.status}`);
        }
        
        const data = await res.json();
        
        renderGrid(data.items.map(item => ({
          videoId: item.id,
          title: item.snippet.title,
          thumbnail: item.snippet.thumbnails.high?.url || item.snippet.thumbnails.default?.url,
          uploader: item.snippet.channelTitle
        })));
      } catch (err) {
        showStatus(`Failed to load videos: ${err.message}`);
        console.error("YouTube API Error:", err);
      }
    }

    // Search Videos
    async function searchVideos() {
      const query = document.getElementById('searchInput').value.trim();
      if (!query) return;

      showStatus(`Searching for "${query}"...`);
      document.getElementById('playerView').style.display = 'none';
      document.getElementById('feedGrid').style.display = 'grid';

      try {
        const url = `${BASE_URL}/search?part=snippet&type=video&maxResults=24&q=${encodeURIComponent(query)}&key=${API_KEY}`;
        const res = await fetch(url);

        if (!res.ok) {
          const errData = await res.json();
          throw new Error(errData.error?.message || `HTTP error ${res.status}`);
        }

        const data = await res.json();

        renderGrid(data.items.map(item => ({
          videoId: item.id.videoId,
          title: item.snippet.title,
          thumbnail: item.snippet.thumbnails.high?.url || item.snippet.thumbnails.default?.url,
          uploader: item.snippet.channelTitle
        })));
      } catch (err) {
        showStatus(`Search failed: ${err.message}`);
        console.error("YouTube API Error:", err);
      }
    }

    // Render Video Cards in Grid
    function renderGrid(items) {
      const grid = document.getElementById('feedGrid');
      grid.innerHTML = '';
      hideStatus();

      if (!items || items.length === 0) {
        showStatus("No results found.");
        return;
      }

      items.forEach(item => {
        if (!item.videoId) return;

        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => openPlayer(item.videoId, item.title, item.uploader);

        card.innerHTML = `
          <div class="thumbnail-container">
            <img src="${item.thumbnail}" alt="${item.title}" loading="lazy" />
          </div>
          <div class="details">
            <div class="title">${item.title}</div>
            <div class="meta">${item.uploader}</div>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    // Open Embedded Player View
    function openPlayer(videoId, title, channel) {
      document.getElementById('feedGrid').style.display = 'none';
      hideStatus();

      const playerView = document.getElementById('playerView');
      const iframe = document.getElementById('videoIframe');
      
      iframe.src = `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1`;
      document.getElementById('playerTitle').textContent = title;
      document.getElementById('playerChannel').textContent = channel;

      playerView.style.display = 'flex';
      window.scrollTo(0, 0);
    }

    function showStatus(msg) {
      const statusEl = document.getElementById('status');
      statusEl.textContent = msg;
      statusEl.style.display = 'block';
    }

    function hideStatus() {
      document.getElementById('status').style.display = 'none';
    }

    // Initial Load
    loadMostPopular();
  </script>
</body>
</html>
