<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YouTube Clone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --yt-bg: #0f0f0f;
      --yt-surface: #212121;
      --yt-surface-hover: #272727;
      --yt-border: #3f3f3f;
      --yt-text: #f1f1f1;
      --yt-text-secondary: #aaa;
      --yt-red: #ff0000;
      --yt-blue: #3ea6ff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', sans-serif; }

    body {
      background-color: var(--yt-bg);
      color: var(--yt-text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* --- HEADER --- */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 56px;
      background: var(--yt-bg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 200;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .header-left { display: flex; align-items: center; gap: 16px; }
    
    .logo {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -1px;
      color: #fff;
      cursor: pointer;
      text-decoration: none;
    }

    .logo-icon {
      color: var(--yt-red);
      width: 30px;
      height: 22px;
    }

    .header-center {
      display: flex;
      align-items: center;
      flex: 0 1 732px;
      gap: 12px;
    }

    .search-form {
      display: flex;
      width: 100%;
      background: #121212;
      border: 1px solid var(--yt-border);
      border-radius: 40px 0 0 40px;
      padding: 0 16px;
      align-items: center;
    }

    .search-form:focus-within {
      border-color: var(--yt-blue);
    }

    .search-form input {
      width: 100%;
      height: 40px;
      background: none;
      border: none;
      color: #fff;
      font-size: 16px;
      outline: none;
    }

    .search-submit {
      background: #222;
      border: 1px solid var(--yt-border);
      border-left: none;
      border-radius: 0 40px 40px 0;
      width: 64px;
      height: 40px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--yt-text);
    }
    .search-submit:hover { background: var(--yt-surface-hover); }
    .search-submit svg { width: 20px; height: 20px; fill: currentColor; }

    .user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #555;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 13px;
      color: #fff;
    }

    /* --- LAYOUT --- */
    .app-body {
      display: flex;
      margin-top: 56px;
      min-height: calc(100vh - 56px);
    }

    sidebar {
      width: 240px;
      background: var(--yt-bg);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      position: sticky;
      top: 56px;
      height: calc(100vh - 56px);
    }

    .sidebar-item {
      display: flex;
      align-items: center;
      gap: 24px;
      padding: 10px 12px;
      border-radius: 10px;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      text-decoration: none;
    }
    .sidebar-item:hover { background: var(--yt-surface-hover); }

    main {
      flex: 1;
      padding: 24px;
      background: var(--yt-bg);
      overflow-y: auto;
    }

    /* --- FEED & CHIPS --- */
    .chips-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      overflow-x: auto;
    }
    .chip {
      background: var(--yt-surface);
      border: none;
      color: #fff;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
    }
    .chip.active { background: #fff; color: #0f0f0f; font-weight: 500; }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 32px 16px;
    }

    .video-card { display: flex; flex-direction: column; gap: 12px; cursor: pointer; }
    .thumbnail-box { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #222; border-radius: 12px; overflow: hidden; }
    .thumbnail-box img { width: 100%; height: 100%; object-fit: cover; }

    .video-meta-row { display: flex; gap: 12px; }
    .card-channel-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
    .card-title { font-size: 16px; font-weight: 500; line-height: 1.3; color: #fff; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-channel-name, .card-stats { font-size: 13px; color: var(--yt-text-secondary); margin-top: 2px; }

    /* --- WATCH VIEW --- */
    .watch-layout {
      display: none;
      grid-template-columns: 1fr 400px;
      gap: 24px;
    }
    @media (max-width: 1000px) { .watch-layout { grid-template-columns: 1fr; } }

    .player-container { position: relative; width: 100%; padding-bottom: 56.25%; border-radius: 12px; overflow: hidden; background: #000; }
    .player-container iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; }

    .watch-title { font-size: 20px; font-weight: 700; margin-top: 12px; }
    .watch-toolbar { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; flex-wrap: wrap; gap: 12px; }
    .channel-row { display: flex; align-items: center; gap: 12px; cursor: pointer; }
    .channel-row img { width: 40px; height: 40px; border-radius: 50%; }

    .description-box { background: var(--yt-surface); border-radius: 12px; padding: 12px; margin-top: 16px; font-size: 14px; white-space: pre-line; color: #f1f1f1; }

    /* --- COMMENTS --- */
    .comments-section { margin-top: 24px; display: flex; flex-direction: column; gap: 16px; }
    .comment-item { display: flex; gap: 16px; font-size: 14px; }
    .comment-item img { width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; }
    .comment-author { font-size: 13px; font-weight: 500; }
    .comment-text { margin-top: 4px; line-height: 1.4; }
    .comment-replies { margin-left: 56px; margin-top: 12px; display: flex; flex-direction: column; gap: 12px; }

    /* --- CHANNEL VIEW --- */
    .channel-layout { display: none; flex-direction: column; gap: 24px; }
    .channel-banner { width: 100%; height: 180px; object-fit: cover; border-radius: 12px; background: #222; }
    .channel-stats-bar { display: flex; gap: 16px; color: var(--yt-text-secondary); font-size: 14px; margin-top: 8px; }

    .status-msg { text-align: center; padding: 40px; color: var(--yt-text-secondary); }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <a class="logo" onclick="app.showFeed()">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
        YouTube
      </a>
    </div>

    <div class="header-center">
      <div class="search-form">
        <input type="text" id="searchInput" placeholder="Search" onkeydown="if(event.key==='Enter') app.searchVideos()" />
      </div>
      <button class="search-submit" onclick="app.searchVideos()">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      </button>
    </div>

    <div class="header-right">
      <div class="user-avatar">Y</div>
    </div>
  </header>

  <div class="app-body">
    <sidebar>
      <a class="sidebar-item" onclick="app.showFeed()">Home</a>
      <a class="sidebar-item" onclick="app.loadChannel('UCX6OQ3DkcsbYNE6H8uQQuVA')">MrBeast</a>
    </sidebar>

    <main>
      <div id="feedView">
        <div class="chips-bar">
          <button class="chip active" onclick="app.filterCategory('All')">All</button>
          <button class="chip" onclick="app.filterCategory('Gaming')">Gaming</button>
          <button class="chip" onclick="app.filterCategory('Tech')">Tech</button>
        </div>
        <div id="videoGrid" class="video-grid"></div>
      </div>

      <div id="watchView" class="watch-layout">
        <div>
          <div class="player-container">
            <iframe id="videoIframe" allowfullscreen allow="autoplay; encrypted-media"></iframe>
          </div>
          <h1 id="watchTitle" class="watch-title">...</h1>
          <div class="watch-toolbar">
            <div id="watchChannelRow" class="channel-row">
              <img id="watchChannelAvatar" src="" alt="" />
              <div>
                <h4 id="watchChannelName">...</h4>
                <p id="watchSubCount" style="color:var(--yt-text-secondary);font-size:12px;"></p>
              </div>
            </div>
          </div>
          <div id="watchDescription" class="description-box"></div>
          
          <div class="comments-section">
            <h3 id="commentCountHeader">Comments</h3>
            <div id="commentsList"></div>
          </div>
        </div>
        
        <div id="recommendedGrid" class="video-grid" style="grid-template-columns: 1fr;"></div>
      </div>

      <div id="channelView" class="channel-layout">
        <img id="channelBanner" class="channel-banner" alt="Banner" />
        <div style="display:flex; gap: 24px; align-items:center;">
          <img id="channelAvatar" style="width:128px;height:128px;border-radius:50%;" alt="Avatar" />
          <div>
            <h1 id="channelName">...</h1>
            <div id="channelStatsBar" class="channel-stats-bar"></div>
            <p id="channelAbout" style="margin-top:8px;font-size:14px;color:var(--yt-text-secondary);"></p>
          </div>
        </div>
        <h3>Uploads</h3>
        <div id="channelGrid" class="video-grid"></div>
      </div>

      <div id="statusMsg" class="status-msg">Loading...</div>
    </main>
  </div>

  <script>
    const CONFIG = {
      API_KEY: 'YOUR_YOUTUBE_API_KEY', // Replace with your standard YouTube Data API v3 key
      BASE_URL: 'https://www.googleapis.com/youtube/v3'
    };

    const helpers = {
      format(num) {
        if (!num) return '0';
        const n = parseInt(num, 10);
        if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
        if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
        return n.toLocaleString();
      }
    };

    class YouTubeClone {
      constructor() {
        this.nextPageToken = null;
        this.currentUploadsPlaylistId = null;
        this.init();
      }

      init() {
        this.loadAllChannelVideos('UCX6OQ3DkcsbYNE6H8uQQuVA');
      }

      setStatus(msg) {
        const el = document.getElementById('statusMsg');
        if (msg) { el.textContent = msg; el.style.display = 'block'; }
        else { el.style.display = 'none'; }
      }

      setView(view) {
        document.getElementById('feedView').style.display = view === 'feed' ? 'block' : 'none';
        document.getElementById('watchView').style.display = view === 'watch' ? 'grid' : 'none';
        document.getElementById('channelView').style.display = view === 'channel' ? 'flex' : 'none';
        if (view !== 'watch') document.getElementById('videoIframe').src = '';
        window.scrollTo(0, 0);
      }

      showFeed() { this.setView('feed'); }

      // Converts Channel ID (UC...) to Uploads Playlist ID (UU...)
      getUploadsPlaylistId(channelId) {
        if (channelId.startsWith('UC')) {
          return 'UU' + channelId.substring(2);
        }
        return channelId;
      }

      // Fetches ALL public uploads from a channel using pagination
      async loadAllChannelVideos(channelId, isNextPage = false) {
        this.setView('feed');

        if (!isNextPage) {
          this.currentUploadsPlaylistId = this.getUploadsPlaylistId(channelId);
          this.nextPageToken = null;
          document.getElementById('videoGrid').innerHTML = '';
        }

        this.setStatus('Loading videos...');

        let url = `${CONFIG.BASE_URL}/playlistItems?part=snippet,contentDetails&playlistId=${this.currentUploadsPlaylistId}&maxResults=50&key=${CONFIG.API_KEY}`;
        if (this.nextPageToken) {
          url += `&pageToken=${this.nextPageToken}`;
        }

        try {
          const res = await fetch(url);
          const data = await res.json();
          if (!data.items) throw new Error('API limit or network error');

          this.nextPageToken = data.nextPageToken || null;

          const items = data.items.map(i => ({
            id: i.snippet.resourceId.videoId,
            channelId: i.snippet.channelId,
            title: i.snippet.title,
            thumb: i.snippet.thumbnails.high?.url || i.snippet.thumbnails.medium?.url,
            channel: i.snippet.channelTitle,
            publishedAt: i.snippet.publishedAt
          }));

          this.appendGridItems(items, 'videoGrid');
          this.updateLoadMoreButton();
          this.setStatus(null);
        } catch (e) {
          this.setStatus(`Error loading channel uploads: ${e.message}`);
        }
      }

      appendGridItems(items, targetId) {
        const grid = document.getElementById(targetId);

        items.forEach(item => {
          if (!item.id || item.title === 'Private video' || item.title === 'Deleted video') return;

          const card = document.createElement('div');
          card.className = 'video-card';
          card.innerHTML = `
            <div class="thumbnail-box"><img src="${item.thumb}" loading="lazy" /></div>
            <div class="video-meta-row">
              <div>
                <div class="card-title">${item.title}</div>
                <div class="card-channel-name">${item.channel}</div>
                <div class="card-stats">${new Date(item.publishedAt).toLocaleDateString()}</div>
              </div>
            </div>
          `;

          card.onclick = (e) => {
            if (e.target.classList.contains('card-channel-name')) this.loadChannel(item.channelId);
            else this.watchVideo(item.id, item.title, item.channelId, item.channel, '');
          };

          grid.appendChild(card);
        });
      }

      updateLoadMoreButton() {
        let btn = document.getElementById('loadMoreBtn');
        
        if (this.nextPageToken) {
          if (!btn) {
            btn = document.createElement('button');
            btn.id = 'loadMoreBtn';
            btn.textContent = 'Load More Videos';
            btn.style.cssText = 'display:block; margin: 30px auto; padding: 12px 24px; background: var(--yt-surface); color: #fff; border: 1px solid var(--yt-border); border-radius: 20px; cursor: pointer; font-weight: 500;';
            btn.onclick = () => this.loadAllChannelVideos(this.currentUploadsPlaylistId, true);
            document.getElementById('feedView').appendChild(btn);
          }
          btn.style.display = 'block';
        } else if (btn) {
          btn.style.display = 'none';
        }
      }

      filterCategory(cat) {
        if (cat === 'All') {
          this.loadAllChannelVideos('UCX6OQ3DkcsbYNE6H8uQQuVA');
        } else {
          this.searchVideosQuery(cat);
        }
      }

      async searchVideos() {
        const q = document.getElementById('searchInput').value.trim();
        if (q) this.searchVideosQuery(q);
      }

      async searchVideosQuery(query) {
        this.setStatus('Searching...');
        this.setView('feed');
        document.getElementById('videoGrid').innerHTML = '';
        
        let btn = document.getElementById('loadMoreBtn');
        if (btn) btn.style.display = 'none';

        try {
          const res = await fetch(`${CONFIG.BASE_URL}/search?part=snippet&type=video&maxResults=24&q=${encodeURIComponent(query)}&key=${CONFIG.API_KEY}`);
          const data = await res.json();
          if (!data.items) throw new Error('Search failed');

          const items = data.items.map(i => ({
            id: i.id.videoId,
            channelId: i.snippet.channelId,
            title: i.snippet.title,
            thumb: i.snippet.thumbnails.high?.url,
            channel: i.snippet.channelTitle,
            publishedAt: i.snippet.publishedAt
          }));

          this.appendGridItems(items, 'videoGrid');
          this.setStatus(null);
        } catch (e) {
          this.setStatus(`Search error: ${e.message}`);
        }
      }

      async watchVideo(id, title, channelId, channelName, avatarUrl) {
        this.setView('watch');
        document.getElementById('videoIframe').src = `https://www.youtube.com/embed/${id}?autoplay=1`;
        document.getElementById('watchTitle').textContent = title;
        document.getElementById('watchChannelName').textContent = channelName;
        document.getElementById('watchChannelAvatar').src = avatarUrl;
        document.getElementById('watchChannelRow').onclick = () => this.loadChannel(channelId);

        try {
          const res = await fetch(`${CONFIG.BASE_URL}/videos?part=snippet,statistics&id=${id}&key=${CONFIG.API_KEY}`);
          const data = await res.json();
          const item = data.items?.[0];
          if (item) {
            document.getElementById('watchDescription').textContent = `${helpers.format(item.statistics.viewCount)} views • ${new Date(item.snippet.publishedAt).toLocaleDateString()}\n\n${item.snippet.description}`;
          }

          const chRes = await fetch(`${CONFIG.BASE_URL}/channels?part=snippet,statistics&id=${channelId}&key=${CONFIG.API_KEY}`);
          const chData = await chRes.json();
          if (chData.items?.[0]) {
            const ch = chData.items[0];
            document.getElementById('watchSubCount').textContent = `${helpers.format(ch.statistics.subscriberCount)} subscribers`;
            document.getElementById('watchChannelAvatar').src = ch.snippet.thumbnails.default.url;
          }
        } catch (e) {}

        this.loadComments(id);
      }

      async loadComments(videoId) {
        const list = document.getElementById('commentsList');
        list.innerHTML = '<p style="color:var(--yt-text-secondary)">Loading comments...</p>';

        try {
          const res = await fetch(`${CONFIG.BASE_URL}/commentThreads?part=snippet,replies&videoId=${videoId}&maxResults=20&key=${CONFIG.API_KEY}`);
          const data = await res.json();
          
          document.getElementById('commentCountHeader').textContent = `${data.items?.length || 0} Comments`;

          list.innerHTML = (data.items || []).map(i => {
            const c = i.snippet.topLevelComment.snippet;
            const replies = i.replies?.comments || [];
            
            return `
              <div class="comment-item">
                <img src="${c.authorProfileImageUrl}" />
                <div>
                  <div class="comment-author">${c.authorDisplayName}</div>
                  <div class="comment-text">${c.textDisplay}</div>
                  
                  <!-- Comment Likes -->
                  <div style="font-size: 12px; color: var(--yt-text-secondary); margin-top: 4px; display: flex; align-items: center; gap: 4px;">
                    <svg style="width: 14px; height: 14px; fill: currentColor;" viewBox="0 0 24 24"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.58 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg>
                    <span>${helpers.format(c.likeCount)}</span>
                  </div>

                  ${replies.length ? `
                    <div class="comment-replies">
                      ${replies.map(r => `
                        <div class="comment-item">
                          <img src="${r.snippet.authorProfileImageUrl}" />
                          <div>
                            <div class="comment-author">${r.snippet.authorDisplayName}</div>
                            <div class="comment-text">${r.snippet.textDisplay}</div>
                            
                            <!-- Reply Likes -->
                            <div style="font-size: 12px; color: var(--yt-text-secondary); margin-top: 4px; display: flex; align-items: center; gap: 4px;">
                              <svg style="width: 14px; height: 14px; fill: currentColor;" viewBox="0 0 24 24"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.58 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg>
                              <span>${helpers.format(r.snippet.likeCount)}</span>
                            </div>
                          </div>
                        </div>
                      `).join('')}
                    </div>
                  ` : ''}
                </div>
              </div>
            `;
          }).join('');
        } catch (e) {
          list.innerHTML = '<p style="color:var(--yt-text-secondary)">Comments disabled or unavailable.</p>';
        }
      }

      async loadChannel(channelId) {
        this.setView('channel');
        this.setStatus('Loading channel metrics...');
        try {
          const res = await fetch(`${CONFIG.BASE_URL}/channels?part=snippet,brandingSettings,contentDetails,statistics&id=${channelId}&key=${CONFIG.API_KEY}`);
          const data = await res.json();
          const ch = data.items[0];

          document.getElementById('channelName').textContent = ch.snippet.title;
          document.getElementById('channelAvatar').src = ch.snippet.thumbnails.high.url;
          document.getElementById('channelBanner').src = ch.brandingSettings?.image?.bannerExternalUrl || '';
          document.getElementById('channelAbout').textContent = ch.snippet.description;
          
          document.getElementById('channelStatsBar').innerHTML = `
            <span><strong>${helpers.format(ch.statistics.subscriberCount)}</strong> subscribers</span>
            <span><strong>${helpers.format(ch.statistics.videoCount)}</strong> videos</span>
            <span><strong>${helpers.format(ch.statistics.viewCount)}</strong> total views</span>
          `;

          const plId = ch.contentDetails.relatedPlaylists.uploads;
          const plRes = await fetch(`${CONFIG.BASE_URL}/playlistItems?part=snippet&playlistId=${plId}&maxResults=24&key=${CONFIG.API_KEY}`);
          const plData = await plRes.json();

          this.appendGridItems(plData.items.map(i => ({
            id: i.snippet.resourceId.videoId,
            channelId,
            title: i.snippet.title,
            thumb: i.snippet.thumbnails.high?.url,
            channel: ch.snippet.title,
            publishedAt: i.snippet.publishedAt
          })), 'channelGrid');
          this.setStatus(null);
        } catch (e) { this.setStatus('Error loading channel data.'); }
      }
    }

    const app = new YouTubeClone();
  </script>
</body>
</html>
