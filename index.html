<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Hub</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #1f1f1f;
      --surface-hover: #272727;
      --text: #ffffff;
      --text-secondary: #aaa;
      --accent: #ff0000;
      --border: #333;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Header & Search Bar */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: var(--bg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
      color: var(--accent);
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .search-container {
      display: flex;
      flex: 0 1 600px;
      gap: 8px;
    }

    .search-container input {
      width: 100%;
      padding: 10px 16px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 15px;
      outline: none;
    }

    .search-container input:focus {
      border-color: #555;
    }

    .search-container button {
      padding: 10px 20px;
      border-radius: 20px;
      border: none;
      background: var(--surface-hover);
      color: var(--text);
      cursor: pointer;
      font-weight: 500;
    }

    .search-container button:hover {
      background: #333;
    }

    /* Main App Layout */
    main {
      padding: 24px;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    /* Video Player View */
    .player-view {
      display: none;
      flex-direction: column;
      gap: 16px;
    }

    .player-wrapper {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }

    .player-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .video-info {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .video-title {
      font-size: 20px;
      font-weight: 600;
    }

    .channel-title {
      color: var(--text-secondary);
      font-size: 14px;
      cursor: pointer;
    }

    .channel-title:hover {
      color: var(--text);
    }

    /* Video Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--surface);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.15s ease;
      display: flex;
      flex-direction: column;
    }

    .card:hover {
      transform: translateY(-4px);
      background: var(--surface-hover);
    }

    .thumbnail-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #222;
    }

    .thumbnail-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .duration {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 12px;
    }

    .details {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .details .title {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .details .meta {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .status-msg {
      text-align: center;
      padding: 40px;
      color: var(--text-secondary);
      font-size: 16px;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo" onclick="loadTrending()">
      <span>▶</span> VideoHub
    </div>
    <div class="search-container">
      <input type="text" id="searchInput" placeholder="Search videos..." onkeydown="if(event.key==='Enter') searchVideos()" />
      <button onclick="searchVideos()">Search</button>
    </div>
  </header>

  <main>
    <!-- Player View -->
    <div id="playerView" class="player-view">
      <div class="player-wrapper">
        <iframe id="videoIframe" allowfullscreen allow="autoplay; encrypted-media"></iframe>
      </div>
      <div class="video-info">
        <h1 id="playerTitle" class="video-title">Loading...</h1>
        <div id="playerChannel" class="channel-title">...</div>
      </div>
    </div>

    <!-- Feed / Search Results Grid -->
    <div id="feedGrid" class="grid"></div>
    <div id="status" class="status-msg">Loading trending feed...</div>
  </main>

  <script>
    // Updated working API instances (Invidious endpoints)
    const API_INSTANCES = [
      'https://inv.privacyredirect.com/api/v1',
      'https://invidious.nerdvpn.de/api/v1',
      'https://vid.puffyan.us/api/v1'
    ];
    let currentApiIndex = 0;

    function getApiUrl() {
      return API_INSTANCES[currentApiIndex];
    }

    function formatDuration(seconds) {
      if (!seconds) return '';
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    async function fetchWithFallback(endpoint) {
      for (let i = 0; i < API_INSTANCES.length; i++) {
        const apiUrl = API_INSTANCES[(currentApiIndex + i) % API_INSTANCES.length];
        try {
          const res = await fetch(`${apiUrl}${endpoint}`);
          if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
          currentApiIndex = (currentApiIndex + i) % API_INSTANCES.length;
          return await res.json();
        } catch (err) {
          console.warn(`Instance ${apiUrl} failed, trying next...`);
        }
      }
      throw new Error("All API instances failed to respond.");
    }

    // Load Trending Videos
    async function loadTrending() {
      showStatus("Loading trending videos...");
      document.getElementById('playerView').style.display = 'none';
      document.getElementById('feedGrid').style.display = 'grid';

      try {
        const data = await fetchWithFallback('/trending?region=US');
        renderGrid(data);
      } catch (err) {
        showStatus("Failed to load feed. Public instances might be temporarily down.");
      }
    }

    // Search Videos
    async function searchVideos() {
      const query = document.getElementById('searchInput').value.trim();
      if (!query) return;

      showStatus(`Searching for "${query}"...`);
      document.getElementById('playerView').style.display = 'none';
      document.getElementById('feedGrid').style.display = 'grid';

      try {
        const data = await fetchWithFallback(`/search?q=${encodeURIComponent(query)}&type=video`);
        renderGrid(data);
      } catch (err) {
        showStatus("Search failed. Please try again in a moment.");
      }
    }

    // Render Video Cards into Grid
    function renderGrid(items) {
      const grid = document.getElementById('feedGrid');
      grid.innerHTML = '';
      hideStatus();

      if (!items || items.length === 0) {
        showStatus("No videos found.");
        return;
      }

      items.forEach(item => {
        // Ensure item is a video with a valid ID
        const videoId = item.videoId || item.id;
        if (!videoId) return;

        const title = item.title || 'Untitled';
        const thumbnail = item.videoThumbnails?.[0]?.url || `https://i.ytimg.com/vi/${videoId}/hqdefault.jpg`;
        const uploader = item.author || item.uploaderName || 'Unknown Channel';
        const views = item.viewCount ? `${Number(item.viewCount).toLocaleString()} views` : '';
        const duration = formatDuration(item.lengthSeconds || item.duration);

        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => openPlayer(videoId, title, uploader);

        card.innerHTML = `
          <div class="thumbnail-container">
            <img src="${thumbnail}" alt="${title}" loading="lazy" />
            ${duration ? `<span class="duration">${duration}</span>` : ''}
          </div>
          <div class="details">
            <div class="title">${title}</div>
            <div class="meta">${uploader} ${views ? '• ' + views : ''}</div>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    // Open Player View using standard YouTube embed
    function openPlayer(videoId, title, channel) {
      document.getElementById('feedGrid').style.display = 'none';
      hideStatus();

      const playerView = document.getElementById('playerView');
      const iframe = document.getElementById('videoIframe');
      
      // Direct YouTube embed for maximum reliability
      iframe.src = `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1`;
      document.getElementById('playerTitle').textContent = title;
      document.getElementById('playerChannel').textContent = channel;

      playerView.style.display = 'flex';
      window.scrollTo(0, 0);
    }

    function showStatus(msg) {
      const statusEl = document.getElementById('status');
      statusEl.textContent = msg;
      statusEl.style.display = 'block';
    }

    function hideStatus() {
      document.getElementById('status').style.display = 'none';
    }

    // Initial Load
    loadTrending();
  </script>
</body>
</html>
